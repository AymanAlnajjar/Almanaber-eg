name: Build and Publish Docker Images

# Builds the frontend + backend production images and pushes them to the GitHub
# Container Registry (GHCR). A server admin can then host the whole site by
# pulling these pre-built images (see docker-compose.registry.yml) instead of
# building Next.js/Laravel on the server.
#
# Resulting images (owner is lower-cased automatically):
#   ghcr.io/<owner>/almnabr-frontend:latest
#   ghcr.io/<owner>/almnabr-backend:latest
#
# NOTE ON THE FRONTEND: Next.js bakes NEXT_PUBLIC_* values at BUILD time, so the
# domain/WhatsApp number are compiled into the frontend image here. They are read
# from GitHub repository *Variables* (Settings > Secrets and variables > Actions >
# Variables), falling back to the current production values if a variable is unset.
# To publish an image for a DIFFERENT domain, set those repo variables and re-run.

on:
  push:
    # feat/locale-routing is temporarily included to build a test image
    # (tagged :feat-locale-routing; :latest stays gated on the default branch).
    # Remove this branch before merging to main.
    branches: [main, feat/locale-routing]
    tags: ['v*.*.*']
  workflow_dispatch: {} # allow manual runs from the Actions tab

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.prod
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lower-case the registry owner (GHCR requires lowercase)
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/almnabr-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Only the frontend consumes these ARGs; the backend ignores them
          # (a harmless "unused build arg" warning). Defaults keep the image
          # working for the current site if the repo variables are not set.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.almnabr.eg/api' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://almnabr.eg' }}
            NEXT_PUBLIC_WHATSAPP_NUMBER=${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER || '201555410885' }}
            NEXT_PUBLIC_WHATSAPP_MESSAGE=${{ vars.NEXT_PUBLIC_WHATSAPP_MESSAGE || 'Hello AlMnabr, I''d like to know more about your services.' }}
